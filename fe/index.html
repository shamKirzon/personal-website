    <title>Shammy Suyat - Software Developer</title>

    <!-- Restores saved preferences before first paint to avoid a flash. -->
    <script>
      try {
        // "light" | "dark" | "system" (default). "system" follows the device setting.
        var theme = localStorage.getItem("theme");
        var prefersLight =
          window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
        if (theme === "light" || (theme !== "dark" && prefersLight)) {
          document.documentElement.classList.add("light");
        }
        if (localStorage.getItem("language") === "fil") {
          document.documentElement.lang = "fil";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
